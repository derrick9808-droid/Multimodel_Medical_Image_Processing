{% extends "examiner/base_examiner.html" %}
{% block title %}Student Sign In — EduExaminer{% endblock %}

{% block content %}
<div class="edu-auth-wrap">
  <div class="edu-auth-card">
    <div class="edu-auth-header">
      <div class="edu-auth-icon edu-auth-icon--student" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
      </div>
      <h1 class="edu-auth-title">Student Sign In</h1>
      <p class="edu-auth-sub">Use your email, password, and register number</p>
    </div>

    {% if error %}
    <div class="edu-inline-error" role="alert">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="{% url 'examiner:student_login' %}" novalidate>
      {% csrf_token %}
      <div class="edu-form-group">
        <label for="email" class="edu-label">Email address <span class="edu-required" aria-hidden="true">*</span></label>
        <input type="email" id="email" name="email" class="edu-input" placeholder="student@school.edu"
               required autocomplete="username" />
      </div>
      <div class="edu-form-group">
        <label for="password" class="edu-label">Password <span class="edu-required" aria-hidden="true">*</span></label>
        <input type="password" id="password" name="password" class="edu-input" placeholder="••••••••"
               required autocomplete="current-password" />
      </div>
      <div class="edu-form-group">
        <label for="register_number" class="edu-label">Register Number <span class="edu-required" aria-hidden="true">*</span></label>
        <input type="text" id="register_number" name="register_number" class="edu-input"
               placeholder="e.g. REG2024001" required autocomplete="off" />
      </div>
      <button type="submit" class="edu-btn edu-btn-primary edu-btn-full edu-btn-lg">Sign In as Student</button>
    </form>

    <div class="edu-auth-footer">
      <a href="{% url 'examiner:landing' %}">← Back to home</a>
    </div>
  </div>
</div>
{% endblock %}
